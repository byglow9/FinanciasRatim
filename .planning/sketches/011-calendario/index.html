<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link id="theme" rel="stylesheet" href="../themes/moeda.css"><link rel="stylesheet" href="../themes/base.css"><link rel="stylesheet" href="../themes/v31.css"><link rel="stylesheet" href="../themes/dock.css">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script><title>011 Calendário v3</title>
<style>
.phone{height:800px}
.col{height:100%;display:flex;flex-direction:column;padding:16px 16px 0;position:relative}
.col>.fixed{flex:none}
.agenda{flex:1;overflow-y:auto;scrollbar-width:none;position:relative;padding:0 16px 120px;margin:0 -16px}.agenda::-webkit-scrollbar{display:none}
.mnav{display:flex;align-items:center;gap:6px;margin-top:10px}
.mlabel{flex:1;text-align:center;font:800 19px var(--font-num);letter-spacing:-.02em}
.tbtn{height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--color-surface);font:700 13px var(--font-sans);color:var(--color-text);cursor:pointer}.tbtn:disabled{opacity:.45;cursor:default}
.msum{display:flex;justify-content:center;gap:14px;margin-top:2px;font-size:12px;font-weight:600;color:var(--color-text-muted)}.msum b{color:var(--color-text);font-family:var(--font-num)}
.bar2{display:flex;gap:8px;align-items:center;margin-top:10px;position:relative}.bar2 .seg{flex:1}
.pop{position:absolute;right:0;top:52px;width:272px;background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:20px;box-shadow:var(--shadow-nav);padding:12px;z-index:30}
.pop h4{font-size:12px;color:var(--color-text-muted);margin:8px 0 4px}.pop h4:first-child{margin-top:0}
.pop .li{display:flex;align-items:center;gap:10px;min-height:32px;font-size:13px;font-weight:600}
.pop .li i.sw{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}.pop .li svg{width:13px;height:13px}
.pop .ramp{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--color-text-muted)}.pop .ramp i{width:22px;height:14px;border-radius:5px;display:inline-block;border:1px solid rgba(0,0,0,.06)}
.pits{display:flex;gap:4px;margin-left:2px}.pits i{width:14px;height:14px;border-radius:3px;display:inline-block}
.wd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;font-weight:700;color:var(--color-text-muted);margin-top:10px;text-transform:uppercase}
.weeks{margin-top:4px;touch-action:pan-y}
.wrow{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px;overflow:hidden;max-height:60px;transition:max-height .22s ease,opacity .18s,margin .22s}
.wrow.hide{max-height:0;opacity:0;margin:0}
.cell{position:relative;height:50px;min-width:0;border-radius:13px;background:var(--color-surface-2);border:1px solid var(--color-border);padding:4px 2px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font:700 13px var(--font-sans);color:var(--color-text)}
.cell:focus-visible{outline:2px solid var(--color-action);outline-offset:1px}
.cell.out{background:none;border-color:transparent;color:var(--color-text-muted)}.cell.out>*{opacity:.45}
.cell .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;line-height:1}
.cell.today .num{background:var(--color-action);color:var(--color-action-text)}
.cell.sel{border:2px solid var(--color-action);padding:3px 1px 2px}
.dts{display:flex;gap:3px;align-items:center;height:8px;margin-top:auto}.dts i{width:6px;height:6px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.14)}.dts em{font:700 9px var(--font-sans);font-style:normal;color:var(--color-text-muted)}
.mpit{position:absolute;top:3px;right:4px;width:11px;height:11px;border-radius:1px 1px 5px 1px;box-shadow:0 1px 1px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.12);transform:rotate(7deg);pointer-events:none}
.mpit.b{right:9px;top:5px;transform:rotate(-9deg)}
.mpit::after{content:'';position:absolute;right:0;bottom:0;width:4px;height:4px;border-radius:0 0 4px 0;background:linear-gradient(135deg,rgba(255,255,255,.7) 50%,rgba(0,0,0,.16) 50%)}
.h1{background:#fef2f2}.h2{background:#fee2e2}.h3{background:#fecaca}.h4{background:#fca5a5}.hp{background:#dcfce7}
.handle{display:flex;justify-content:center}.handle button{border:0;background:none;height:28px;width:96px;display:grid;place-items:center;color:var(--color-text-muted);cursor:pointer}
.agd{display:grid;grid-template-columns:50px 1fr;gap:8px;margin-top:12px}
.agd .dn{text-align:center;font-size:11px;font-weight:700;color:var(--color-text-muted);text-transform:uppercase;padding-top:4px}
.agd .dn b{display:block;font:800 22px var(--font-num);color:var(--color-text);border-radius:12px;margin-top:1px}
.agd .dn small{display:block;font:800 10px var(--font-num);letter-spacing:-.02em;text-transform:none;margin-top:2px}
.agd.today .dn b{color:var(--color-primary)}.agd.sel .dn b{background:var(--color-action);color:var(--color-action-text)}
.ev{display:flex;align-items:center;gap:10px;background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:16px;padding:8px 12px;margin-bottom:6px;min-height:52px}
.ev .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}.ev .ic svg{width:17px;height:17px}
.ev b{font-size:14px;display:block}.ev span.s{font-size:12px;color:var(--color-text-muted)}.ev .v{margin-left:auto;font:800 14px var(--font-num);white-space:nowrap}
.st{display:inline-block;font:700 10px var(--font-sans);border-radius:99px;padding:2px 7px;margin-left:6px;vertical-align:1px}
.st.red{background:#fee2e2;color:#991b1b}.st.org{background:#ffedd5;color:#9a3412}
.pit{position:relative;display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;border-radius:4px 4px 16px 4px;padding:12px 14px;margin-bottom:8px;min-height:52px;cursor:pointer;color:#1b1b18;font:600 14px var(--font-sans);box-shadow:0 1px 0 rgba(0,0,0,.08),0 6px 12px rgba(0,0,0,.08);transform:rotate(-.5deg)}
.pit:nth-of-type(even){transform:rotate(.4deg)}
.pit svg{width:16px;height:16px;flex:none;margin-top:2px;opacity:.65}
.pit::after{content:'';position:absolute;right:0;bottom:0;width:16px;height:16px;border-radius:0 0 16px 0;background:linear-gradient(135deg,rgba(255,255,255,.55) 50%,rgba(0,0,0,.12) 50%)}
.empty{text-align:center;padding:24px 8px;color:var(--color-text-muted);font-size:14px}
.empty button{margin-top:10px;height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--color-action);color:var(--color-action-text);font:700 14px var(--font-sans);cursor:pointer}
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end}
.sheetin{width:100%;background:var(--color-bg);border-radius:28px 28px 0 0;padding:10px 16px 22px}
.sheetin input[type=text]{width:100%;height:52px;border-radius:16px;border:1px solid var(--color-border);background:var(--color-surface-2);padding:0 16px;font:600 16px var(--font-sans);margin-top:12px;color:var(--color-text)}
.swatches{display:flex;gap:10px;margin-top:12px}.swatches button{width:44px;height:44px;border-radius:12px;border:2px solid transparent;cursor:pointer;display:grid;place-items:center;color:#1b1b18}.swatches button.on{border-color:#1b1b18}
.sheetin .row2{display:flex;gap:8px;margin-top:14px}.sheetin .row2 button{flex:1;height:52px;border-radius:16px;border:0;font:700 15px var(--font-sans);cursor:pointer}
.btn-p{background:var(--color-action);color:var(--color-action-text)}.btn-p:disabled{opacity:.4;cursor:default}.btn-s{background:var(--color-surface);color:var(--color-text)}.btn-d{background:#fee2e2;color:#991b1b}
.toast{position:absolute;left:16px;right:16px;top:12px;background:var(--color-action);color:var(--color-action-text);border-radius:16px;padding:12px 14px;font-size:13px;font-weight:700;z-index:60}
#selftest{white-space:pre-wrap;font:11px monospace;max-width:420px;margin:8px auto;color:#333}
</style></head><body>
<div id="variant-nav"><span style="font:700 13px system-ui;align-self:center">Calendário v3: mês que recolhe + mapa de calor + post-its.</span>
<span style="font:13px system-ui;align-self:center;margin-left:auto">dock:</span>
<button class="variant-tab active" data-dock="a">A</button><button class="variant-tab" data-dock="b">B</button><button class="variant-tab" data-dock="c">C</button></div>
<div class="phone"><div id="app" style="height:100%"></div><div id="dockhost"></div></div>
<div class="note" id="vnote">Cor do dia = intensidade do gasto (relativa ao seu mês). Pontos: entrada, saída, conta pendente, paga, porquinho, meta e a cor de cada post-it. "Hoje" continua em círculo. Role a agenda: o mês recolhe para a semana.</div><div id="selftest"></div>
<div id="sketch-tools">tema: <select id="themesel" onchange="setTheme(this.value)"><option>moeda</option><option>brasa</option><option>noite</option></select></div>
<script src="../themes/sketch.js"></script><script src="../themes/dock.js"></script>
<script>
(function(){
'use strict';
var errors=[];window.addEventListener('error',function(e){errors.push(String(e.message))});
var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var DABR=['dom','seg','ter','qua','qui','sex','sáb'];
var TODAY=new Date(2026,10,18);
var PIT={yellow:'#fde047',blue:'#67e8f9',green:'#bef264',pink:'#e879f9',purple:'#c4b5fd'};
var PITN={yellow:'Amarelo',blue:'Azul',green:'Verde',pink:'Rosa',purple:'Roxo'};
var TYPES={in:{c:'#16a34a',icon:'arrow-up-right',label:'Entrada'},out:{c:'#ef4444',icon:'arrow-down-left',label:'Saída'},
 fixp:{c:'#ea580c',icon:'clock',label:'Conta pendente'},fixd:{c:'#65a30d',icon:'check',label:'Conta paga'},
 pig:{c:'#ec4899',icon:'piggy-bank',label:'Porquinho'},goal:{c:'#8b5cf6',icon:'target',label:'Meta'},note:{c:'#eab308',icon:'sticky-note',label:'Post-it'},
 e_trab:{c:'#0284c7',icon:'briefcase',label:'Trabalho'},e_saude:{c:'#dc2626',icon:'heart-pulse',label:'Saúde'},e_casa:{c:'#ca8a04',icon:'home',label:'Casa'},e_lazer:{c:'#9333ea',icon:'party-popper',label:'Lazer'}};
var FIN=['in','out','fixp','fixd','pig','goal','note'],AGD=['e_trab','e_saude','e_casa','e_lazer'];
var NETT={in:1,out:1,fixd:1,pig:1};
var S={needScroll:true,prog:false,y:2026,m:10,sel:new Date(2026,10,18),mode:'fin',legend:false,sheet:null,color:'yellow',cat:'e_lazer',collapsed:false,lock:false,toast:'',seq:10,
 notes:[{id:'n1',iso:'2026-11-15',text:'Ligar para o contador',color:'yellow'},{id:'n2',iso:'2026-11-18',text:'Conferir o IPTU antes de pagar',color:'purple'},{id:'n3',iso:'2026-11-20',text:'Levar o gato ao veterinário',color:'green'},{id:'n4',iso:'2026-11-27',text:'Comprar presente da Ana',color:'pink'}],
 events:[{id:'e1',iso:'2026-11-03',text:'Consulta',cat:'e_saude'},{id:'e2',iso:'2026-11-11',text:'Reunião',cat:'e_trab'},{id:'e3',iso:'2026-11-14',text:'Dentista',cat:'e_saude'},{id:'e4',iso:'2026-11-21',text:'Jantar',cat:'e_lazer'},{id:'e5',iso:'2026-11-24',text:'Faxina',cat:'e_casa'},{id:'e6',iso:'2026-11-28',text:'Cinema',cat:'e_lazer'}]};
var SEED=JSON.stringify({n:S.notes,e:S.events});
function cap(t){return t.charAt(0).toUpperCase()+t.slice(1)}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function same(a,b){return iso(a)===iso(b)}
function brl(v){return 'R$ '+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function sg(v){return (v<0?'- ':v>0?'+ ':'')+brl(v)}
function short(v){var a=Math.abs(v),s=a>=1000?(a/1000).toFixed(1).replace('.',',')+'k':String(Math.round(a));return (v<0?'-':'+')+s}
function rnd(n){var x=Math.sin(n*9301+49297)*233280;return x-Math.floor(x)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function dayDiff(a,b){return Math.round((new Date(a.getFullYear(),a.getMonth(),a.getDate())-new Date(b.getFullYear(),b.getMonth(),b.getDate()))/864e5)}
var FIX={5:['Aluguel',1200,'home'],10:['Internet',99.9,'wifi'],15:['Seguro do carro',210,'car',1],18:['Condomínio',380,'building-2'],19:['Energia',142,'zap'],27:['Academia',89.9,'dumbbell']};
var EXP=[['Mercado','shopping-cart'],['Posto Shell','fuel'],['Restaurante','utensils'],['Farmácia','pill'],['Uber','car'],['Cinema','film']];
function baseItems(d){
 var seed=d.getFullYear()*400+d.getMonth()*35+d.getDate(),dn=d.getDate(),o=[],past=d<TODAY,today=same(d,TODAY),upto=d<=TODAY,cur=(d.getFullYear()===2026&&d.getMonth()===10);
 if(FIX[dn]){var f=FIX[dn],unpaid=!!f[3]&&cur,paid=past&&!unpaid;
  o.push({t:paid?'fixd':'fixp',label:f[0],amt:-f[1],icon:f[2],sub:paid?'paga':(today?'vence hoje':(past?'venceu dia '+dn:'a pagar')),od:past&&!paid,soon:!past&&dayDiff(d,TODAY)<=3})}
 if(dn===5)o.push({t:'in',label:'Salário',amt:5200,sub:upto?'recebido':'previsto'});
 if(dn===20)o.push({t:'in',label:'Freela',amt:800,sub:upto?'recebido':'previsto'});
 if(today){o.push({t:'out',label:'Mercado',amt:-186.3,sub:'18:42',icon:'shopping-cart'});o.push({t:'out',label:'Posto Shell',amt:-210,sub:'12:10',icon:'fuel'})}
 else if(upto&&rnd(seed)<.5){var n=1+Math.floor(rnd(seed+1)*3);for(var i=0;i<n;i++){var e=EXP[Math.floor(rnd(seed+i+2)*6)];o.push({t:'out',label:e[0],amt:-Math.round((20+rnd(seed+i+7)*180)*10)/10,sub:pad(8+Math.floor(rnd(seed+i)*12))+':'+pad(Math.floor(rnd(seed+i+3)*60)),icon:e[1]})}}
 if(dn===12&&upto)o.push({t:'pig',label:'Depósito no Porquinho',amt:-150,sub:'transferência'});
 if(dn===21)o.push({t:'goal',label:'Meta: Viagem',amt:-300,sub:'aporte planejado'});
 return o}
function items(d){var k=iso(d),all=baseItems(d);
 S.notes.forEach(function(n){if(n.iso===k)all.push({t:'note',label:n.text,amt:0,id:n.id,color:PIT[n.color],ck:n.color})});
 S.events.forEach(function(n){if(n.iso===k)all.push({t:n.cat,label:n.text,amt:0,id:n.id,sub:'evento'})});
 var set=S.mode==='fin'?FIN:AGD;return all.filter(function(x){return set.indexOf(x.t)>-1})}
function net(d){if(d>TODAY)return 0;return items(d).reduce(function(a,x){return a+(NETT[x.t]?x.amt:0)},0)}
function monthDays(y,m){return new Date(y,m+1,0).getDate()}
function summaryHTML(){
 if(S.mode==='agd'){var c=0,n=monthDays(S.y,S.m);for(var i=1;i<=n;i++)c+=items(new Date(S.y,S.m,i)).length;return '<div class="msum"><span><b>'+c+'</b> '+(c===1?'evento':'eventos')+' no mês</span></div>'}
 var out=0,pend=0,n2=monthDays(S.y,S.m);for(var j=1;j<=n2;j++){var d=new Date(S.y,S.m,j);baseItems(d).forEach(function(x){if(x.t==='fixp')pend-=x.amt;else if(d<=TODAY&&NETT[x.t]&&x.t!=='in')out-=x.amt})}
 return '<div class="msum"><span>Saiu <b>'+brl(out)+'</b></span><span>A pagar <b style="color:#c2410c">'+brl(pend)+'</b></span></div>'}
function heatLevels(){var vals=[],n=monthDays(S.y,S.m);for(var i=1;i<=n;i++){var v=net(new Date(S.y,S.m,i));if(v<0)vals.push(-v)}vals.sort(function(a,b){return a-b});
 function q(p){return vals.length?vals[Math.min(vals.length-1,Math.floor(p*vals.length))]:0}var q1=q(.25),q2=q(.5),q3=q(.75);
 return function(v){if(v>0)return 'hp';if(v===0)return '';var a=-v;return a<=q1?'h1':a<=q2?'h2':a<=q3?'h3':'h4'}}
function dotColors(it){var seen=[],out=[];it.forEach(function(x){if(x.t==='note')return;var c=x.color||TYPES[x.t].c;if(seen.indexOf(c)<0){seen.push(c);out.push(c)}});return out}
function dotsHTML(it){var cs=dotColors(it),more=cs.length>3?'<em>+'+(cs.length-3)+'</em>':'';return '<span class="dts">'+cs.slice(0,3).map(function(c){return '<i style="background:'+c+'"></i>'}).join('')+more+'</span>'}
function pitsHTML(it){var n=it.filter(function(x){return x.t==='note'});if(!n.length)return '';return n.slice(0,2).map(function(x,i){return '<i class="mpit'+(i?' b':'')+'" style="background:'+x.color+'"></i>'}).join('')}
function cellsFor(days,lvl){return days.map(function(d){
 var out=d.getMonth()!==S.m,it=items(d),isT=same(d,TODAY),isS=same(d,S.sel),v=net(d);
 var cls='cell'+(out?' out':'')+(isT?' today':'')+(isS?' sel':'');if(S.mode==='fin'&&!out){var l=lvl(v);if(l)cls+=' '+l}
 var label=d.getDate()+' de '+MESES[d.getMonth()]+(isT?', hoje':'')+', '+(it.length?it.length+(it.length===1?' item':' itens'):'sem itens')+(S.mode==='fin'&&v?', saldo '+sg(v):'');
 return '<button class="'+cls+'" data-act="day" data-d="'+iso(d)+'" tabindex="'+(isS?0:-1)+'" aria-label="'+label+'"'+(isT?' aria-current="date"':'')+' aria-pressed="'+isS+'"><span class="num">'+d.getDate()+'</span>'+pitsHTML(it)+dotsHTML(it)+'</button>'}).join('')}
function weeksOf(){var first=new Date(S.y,S.m,1),start=new Date(S.y,S.m,1-first.getDay()),rows=[],n=Math.ceil((first.getDay()+monthDays(S.y,S.m))/7);
 for(var r=0;r<n;r++){var row=[];for(var c=0;c<7;c++)row.push(new Date(start.getFullYear(),start.getMonth(),start.getDate()+r*7+c));rows.push(row)}return rows}
function gridHTML(){var rows=weeksOf(),lvl=heatLevels(),selIso=iso(S.sel);
 return '<div class="wd"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div><div class="weeks" id="weeks" role="group" aria-label="'+MESES[S.m]+' de '+S.y+'">'+
 rows.map(function(r){var has=r.some(function(d){return iso(d)===selIso});return '<div class="wrow'+(S.collapsed&&!has?' hide':'')+'">'+cellsFor(r,lvl)+'</div>'}).join('')+'</div>'}
function legendPop(){if(!S.legend)return '';
 if(S.mode==='agd')return '<div class="pop" role="dialog" aria-label="Legenda"><h4>Categorias</h4>'+AGD.map(function(t){var T=TYPES[t];return '<div class="li"><i class="sw" style="background:'+T.c+'"><i data-lucide="'+T.icon+'"></i></i>'+T.label+'</div>'}).join('')+'</div>';
 var dots=['in','out','fixp','fixd','pig','goal'];
 return '<div class="pop" role="dialog" aria-label="Legenda"><h4>Cor do dia</h4><div class="ramp">menos<i style="background:#fef2f2"></i><i style="background:#fee2e2"></i><i style="background:#fecaca"></i><i style="background:#fca5a5"></i>mais gasto</div><div class="ramp" style="margin-top:6px"><i style="background:#dcfce7"></i>dia com saldo positivo</div>'+
 '<h4>Pontinhos</h4>'+dots.map(function(t){var T=TYPES[t];return '<div class="li"><i class="sw" style="background:'+T.c+'"><i data-lucide="'+T.icon+'"></i></i>'+T.label+'</div>'}).join('')+
 '<div class="li"><i class="sw" style="background:none;position:relative"><i class="mpit" style="background:#fde047;position:relative;top:0;right:0;width:16px;height:16px"></i></i>Post-it no canto<span class="pits">'+Object.keys(PIT).map(function(k){return '<i style="background:'+PIT[k]+'"></i>'}).join('')+'</span></div></div>'}
function headHTML(){var isNow=S.y===TODAY.getFullYear()&&S.m===TODAY.getMonth()&&same(S.sel,TODAY);
 return '<div class="top"><h1>Calendário</h1><span class="muted small" style="font-weight:700">Ele</span></div>'+
 '<div class="mnav"><button class="round" data-act="prev" aria-label="Mês anterior"><i data-lucide="chevron-left"></i></button><div class="mlabel" id="mlabel" aria-live="polite">'+cap(MESES[S.m])+' '+S.y+'</div><button class="round" data-act="next" aria-label="Próximo mês"><i data-lucide="chevron-right"></i></button><button class="tbtn" data-act="today"'+(isNow?' disabled':'')+'>Hoje</button></div>'+summaryHTML()+
