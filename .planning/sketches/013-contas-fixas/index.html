<style>
.phone{height:800px}

.binfo .sb{display:block;font-size:12px;color:var(--color-text-muted);font-weight:600}.od .sb{color:#991b1b}.soon .sb{color:#9a3412}

.tl .dn b{display:block;font:800 20px var(--font-num);color:var(--color-text)}

.todaymk{display:flex;align-items:center;gap:8px;grid-column:1/3;font-size:11px;font-weight:800;color:var(--color-primary);text-transform:uppercase;letter-spacing:.05em}.todaymk::before,.todaymk::after{content:'';height:2px;background:var(--color-primary);opacity:.35;flex:1;border-radius:2px}
.cat{background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:4px 12px 4px;margin-top:12px}
.cat .hd{display:flex;align-items:center;gap:10px;padding:10px 0}.cat .hd .ic{width:36px;height:36px;border-radius:50%;background:var(--color-surface);display:grid;place-items:center;flex:none}.cat .hd .ic svg{width:17px;height:17px}
.cat .hd b{font-size:15px}.cat .hd small{display:block;font-size:12px;color:var(--color-text-muted);font-weight:600}.cat .hd .tot{margin-left:auto;font:800 15px var(--font-num)}

.cat .mini{height:5px;border-radius:9px;background:var(--color-track);overflow:hidden;margin:0 0 8px}.cat .mini i{display:block;height:100%;background:var(--color-primary)}
.empty{text-align:center;padding:28px 8px;color:var(--color-text-muted);font-size:14px}
.empty button{margin-top:10px;height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--color-action);color:var(--color-action-text);font:700 14px var(--font-sans);cursor:pointer}
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end}
.sheetin{width:100%;background:var(--color-bg);border-radius:28px 28px 0 0;padding:10px 16px 22px;max-height:92%;overflow:auto}
.fld{margin-top:12px}.fld label{display:block;font-size:12px;font-weight:700;color:var(--color-text-muted);margin-bottom:4px}

.act-row.dg{color:#b91c1c}
.row2{display:flex;gap:8px;margin-top:14px}.row2 button{flex:1;height:52px;border-radius:16px;border:0;font:700 15px var(--font-sans);cursor:pointer}
.btn-p{background:var(--color-action);color:var(--color-action-text)}.btn-s{background:var(--color-surface);color:var(--color-text)}.btn-d{background:#b91c1c;color:#fff}

#selftest{white-space:pre-wrap;font:11px monospace;max-width:420px;margin:8px auto;color:#333}
</style></head><body>

<script>
(function(){
'use strict';
var errors=[];window.addEventListener('error',function(e){errors.push(String(e.message))});
var TODAY=18;
var CATS={Moradia:'home',Transporte:'car',Lazer:'clapperboard',Saúde:'heart-pulse',Contas:'zap',Outros:'receipt'};
var NOTES={a:'Lista por urgência: o que já venceu e o que vence em até 3 dias sobe para o topo (mesma regra do app). Pagas ficam recolhidas. A caixa quadrada marca como paga e, para desfazer, basta tocar de novo.',
b:'Linha do tempo do mês na ordem de vencimento, com um marcador "Hoje" separando o que já passou do que vem. Boa para ver o mês inteiro como uma sequência.',
c:'ESCOLHIDA. Categorias em ordem fixa (nunca mudam de lugar ao marcar paga), com subtotal e barra de progresso por grupo, e filtro Todas / Pendentes / Pagas. Boa para saber quanto de cada tipo de gasto fixo ainda falta pagar.'};
var DEFAULT=[{id:'b1',name:'Aluguel',amount:1200,day:5,cat:'Moradia',paid:true},{id:'b2',name:'Internet',amount:99.9,day:10,cat:'Contas',paid:true},{id:'b3',name:'Streaming',amount:44.9,day:12,cat:'Lazer',paid:true},
 {id:'b4',name:'Seguro do carro',amount:210,day:15,cat:'Transporte',paid:false},{id:'b5',name:'Condomínio',amount:380,day:18,cat:'Moradia',paid:false},{id:'b6',name:'Energia',amount:142,day:19,cat:'Contas',paid:false},
 {id:'b7',name:'Água',amount:78.4,day:22,cat:'Contas',paid:false},{id:'b8',name:'Celular',amount:59.9,day:25,cat:'Contas',paid:false},{id:'b9',name:'Academia',amount:89.9,day:27,cat:'Saúde',paid:false}];
var S={v:'c',bills:JSON.parse(JSON.stringify(DEFAULT)),seq:20,sheet:null,filter:'all',showPaid:false,toast:null,err:{}};
function brl(v){return 'R$ '+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function status(b){if(b.paid)return 'paid';if(b.day<TODAY)return 'od';if(b.day<=TODAY+3)return 'soon';return 'pending'}
function sub(b){var s=status(b),d=b.day-TODAY;
 if(s==='paid')return 'Paga · dia '+b.day;if(s==='od')return 'Venceu dia '+b.day+' · '+(-d)+(d===-1?' dia':' dias')+' de atraso';
 if(d===0)return 'Vence hoje';if(d===1)return 'Vence amanhã · dia '+b.day;return 'Vence dia '+b.day+' · em '+d+' dias'}
function totals(){var t=0,p=0,n=0;S.bills.forEach(function(b){t+=b.amount;if(b.paid){p+=b.amount;n++}});return {total:t,paid:p,pending:t-p,nPaid:n,n:S.bills.length}}
function sorted(){return S.bills.slice().sort(function(a,b){return a.day-b.day||a.name.localeCompare(b.name)})}
function find(id){return S.bills.filter(function(b){return b.id===id})[0]}
function kpis(){var t=totals();return '<div class="kpis"><div class="kpi3"><small><i data-lucide="receipt"></i>Total mensal</small><b id="k-total">'+brl(t.total)+'</b></div><div class="kpi3"><small style="color:#166534"><i data-lucide="circle-check"></i>Pagas</small><b id="k-paid" style="color:#166534">'+brl(t.paid)+'</b></div><div class="kpi3"><small style="color:#c2410c"><i data-lucide="clock"></i>Pendentes</small><b id="k-pend" style="color:#c2410c">'+brl(t.pending)+'</b></div></div>'}
function head(){return '<div class="top"><h1>Contas fixas</h1><button class="round act" data-act="new" aria-label="Nova conta fixa"><i data-lucide="plus"></i></button></div>'}
function billHTML(b){var s=status(b),ic=CATS[b.cat]||'receipt';
 return '<div class="bill '+s+'" data-id="'+b.id+'"><button class="chk" data-act="toggle" data-id="'+b.id+'" aria-pressed="'+b.paid+'" aria-label="'+(b.paid?'Desmarcar':'Marcar como paga')+': '+esc(b.name)+'"><span class="bx"><i data-lucide="check"></i></span></button>'+
 '<button class="binfo" data-act="open" data-id="'+b.id+'" aria-label="Opções de '+esc(b.name)+'"><span class="ic"><i data-lucide="'+ic+'"></i></span><span class="m"><span class="nm">'+esc(b.name)+'</span><span class="sb">'+sub(b)+'</span></span><span class="v">'+brl(b.amount)+'</span></button></div>'}
function emptyHTML(){return '<div class="empty">Nenhuma conta fixa cadastrada.<br><button data-act="new">Cadastrar a primeira</button></div>'}
function bodyA(){var t=totals(),pct=t.total?Math.round(t.paid/t.total*100):0,g={od:[],soon:[],pending:[],paid:[]};sorted().forEach(function(b){g[status(b)].push(b)});
 if(!S.bills.length)return kpis()+emptyHTML();
 var h='<div class="hero"><div class="muted small" style="font-weight:700">Falta pagar neste mês</div><div class="big" id="hero-pend">'+brl(t.pending)+'</div><div class="prog" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100" aria-label="Contas pagas"><i style="width:'+pct+'%"></i></div><div class="row sp small muted" style="margin-top:6px;font-weight:600"><span>'+t.nPaid+' de '+t.n+' pagas</span><span>'+pct+'%</span></div></div>'+kpis();
 function sec(title,list,id){return list.length?'<div class="sec"><span>'+title+'<span class="cnt">'+list.length+'</span></span></div><div id="'+id+'">'+list.map(billHTML).join('')+'</div>':''}
 h+=sec('Atrasadas',g.od,'sec-od')+sec('Vencem em breve',g.soon,'sec-soon')+sec('Mais adiante',g.pending,'sec-pending');
 if(g.paid.length)h+='<div class="sec"><span>Pagas<span class="cnt">'+g.paid.length+'</span></span><button data-act="showpaid" aria-expanded="'+S.showPaid+'">'+(S.showPaid?'Ocultar':'Mostrar')+'<i data-lucide="'+(S.showPaid?'chevron-up':'chevron-down')+'"></i></button></div>'+(S.showPaid?'<div id="sec-paid">'+g.paid.map(billHTML).join('')+'</div>':'');
 return h}
function bodyB(){if(!S.bills.length)return kpis()+emptyHTML();var l=sorted(),o='',mark=false;
 l.forEach(function(b){if(!mark&&b.day>=TODAY){mark=true;o+='<div class="d todaydiv" id="today-mk"><div class="todaymk">Hoje · dia '+TODAY+'</div></div>'}
  o+='<div class="d" data-d="'+b.day+'"><div class="dn">dia<b>'+b.day+'</b></div><div>'+billHTML(b)+'</div></div>'});
 if(!mark)o+='<div class="d todaydiv" id="today-mk"><div class="todaymk">Hoje · dia '+TODAY+'</div></div>';
 return kpis()+'<div class="tl" id="timeline">'+o+'</div>'}
function bodyC(){var f=S.filter;var list=sorted().filter(function(b){return f==='all'||(f==='pend'&&!b.paid)||(f==='paid'&&b.paid)});
 var seg='<div class="seg" style="margin-top:14px" role="tablist">'+[['all','Todas'],['pend','Pendentes'],['paid','Pagas']].map(function(x){return '<button role="tab" data-act="filter" data-f="'+x[0]+'" class="'+(f===x[0]?'on':'')+'" aria-selected="'+(f===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
 if(!S.bills.length)return kpis()+emptyHTML();
 var groups={};list.forEach(function(b){(groups[b.cat]=groups[b.cat]||[]).push(b)});
 var all={};S.bills.forEach(function(b){(all[b.cat]=all[b.cat]||[]).push(b)});
 var o=Object.keys(CATS).concat(Object.keys(groups).filter(function(c){return !(c in CATS)})).filter(function(c){return groups[c]}).map(function(c){var g=groups[c],a=all[c],tot=a.reduce(function(s,b){return s+b.amount},0),pd=a.filter(function(b){return b.paid}).reduce(function(s,b){return s+b.amount},0),pct=tot?Math.round(pd/tot*100):0;
  return '<div class="cat" data-cat="'+esc(c)+'"><div class="hd"><span class="ic"><i data-lucide="'+(CATS[c]||'receipt')+'"></i></span><div><b>'+esc(c)+'</b><small>'+a.filter(function(b){return b.paid}).length+' de '+a.length+' pagas</small></div><span class="tot">'+brl(tot)+'</span></div><div class="mini"><i style="width:'+pct+'%"></i></div>'+g.map(billHTML).join('')+'</div>'}).join('');
 return kpis()+seg+(o||'<div class="empty">Nenhuma conta neste filtro.</div>')}
function sheetHTML(){var sh=S.sheet;if(!sh)return '';
 if(sh.kind==='menu'){var b=find(sh.id);if(!b)return '';
  if(sh.confirm)return '<div class="sheetbg" data-act="close"><div class="sheetin" role="alertdialog" aria-label="Apagar conta"><div style="width:40px;height:4px;border-radius:9px;background:var(--color-track);margin:0 auto 10px"></div><b style="font-size:18px">Apagar '+esc(b.name)+'?</b><div class="muted small" style="margin-top:4px">A conta some de todos os meses. Isso não pode ser desfeito.</div><div class="row2"><button class="btn-s" data-act="close">Cancelar</button><button class="btn-d" data-act="confirmdel">Apagar</button></div></div></div>';
  return '<div class="sheetbg" data-act="close"><div class="sheetin" role="dialog" aria-label="Opções de '+esc(b.name)+'"><div style="width:40px;height:4px;border-radius:9px;background:var(--color-track);margin:0 auto 10px"></div><div class="row"><div class="ico"><i data-lucide="'+(CATS[b.cat]||'receipt')+'"></i></div><div><b>'+esc(b.name)+'</b><div class="muted small">'+esc(b.cat)+' · dia '+b.day+'</div></div><b class="big" style="margin-left:auto;font-size:20px">'+brl(b.amount)+'</b></div>'+
  '<button class="act-row" data-act="toggle" data-id="'+b.id+'" data-close="1"><i data-lucide="check"></i>'+(b.paid?'Desmarcar como paga':'Marcar como paga')+'</button><button class="act-row" data-act="edit" data-id="'+b.id+'"><i data-lucide="pencil"></i>Editar</button><button class="act-row dg" data-act="del"><i data-lucide="trash-2"></i>Apagar</button></div></div>'}
 var ed=sh.kind==='edit',b2=ed?find(sh.id):null,v=sh.draft||{name:b2?b2.name:'',amount:b2?String(b2.amount).replace('.',','):'',day:b2?String(b2.day):'',cat:b2?b2.cat:'Contas'},E=S.err;
 return '<div class="sheetbg" data-act="close"><div class="sheetin" role="dialog" aria-modal="true" aria-label="'+(ed?'Editar conta fixa':'Nova conta fixa')+'"><div style="width:40px;height:4px;border-radius:9px;background:var(--color-track);margin:0 auto 6px"></div><b style="font-size:18px">'+(ed?'Editar conta fixa':'Nova conta fixa')+'</b>'+
 '<div class="fld"><label for="f-name">Nome</label><input id="f-name" type="text" maxlength="40" value="'+esc(v.name)+'" placeholder="Ex.: Plano de saúde" aria-invalid="'+!!E.name+'" aria-describedby="e-name"><div class="err" id="e-name" role="alert">'+(E.name||'')+'</div></div>'+
 '<div class="two"><div class="fld"><label for="f-amount">Valor (R$)</label><input id="f-amount" type="text" inputmode="decimal" value="'+esc(v.amount)+'" placeholder="0,00" aria-invalid="'+!!E.amount+'" aria-describedby="e-amount"><div class="err" id="e-amount" role="alert">'+(E.amount||'')+'</div></div>'+
 '<div class="fld"><label for="f-day">Dia do vencimento</label><input id="f-day" type="text" inputmode="numeric" maxlength="2" value="'+esc(v.day)+'" placeholder="1 a 31" aria-invalid="'+!!E.day+'" aria-describedby="e-day"><div class="err" id="e-day" role="alert">'+(E.day||'')+'</div></div></div>'+
 '<div class="fld"><label>Categoria</label><div class="chips" role="radiogroup">'+Object.keys(CATS).map(function(c){return '<button class="fc'+(v.cat===c?' on':'')+'" role="radio" aria-checked="'+(v.cat===c)+'" data-act="cat" data-c="'+c+'"><i data-lucide="'+CATS[c]+'" style="width:16px;height:16px"></i>'+c+'</button>'}).join('')+'</div></div>'+
 '<div class="row2"><button class="btn-s" data-act="close">Cancelar</button><button class="btn-p" data-act="save">Salvar</button></div></div></div>'}
function toastHTML(){var t=S.toast;return t?'<div class="toast" role="status"><span>'+esc(t.text)+'</span>'+''+'</div>':''}
var tt=null;function toast(text,undo){S.toast={text:text,undo:undo||null};clearTimeout(tt);render();tt=setTimeout(function(){S.toast=null;render()},4200)}
function render(){var app=document.getElementById('app'),pg=app.querySelector('.page'),st=pg?pg.scrollTop:0;
 app.innerHTML='<div class="page" id="page">'+head()+(S.v==='a'?bodyA():S.v==='b'?bodyB():bodyC())+'</div>'+sheetHTML()+toastHTML();
 app.querySelector('.page').scrollTop=st;if(window.lucide)lucide.createIcons();
 document.querySelectorAll('.variant-tab').forEach(function(b){b.classList.toggle('active',b.dataset.v===S.v)});document.getElementById('vnote').textContent=NOTES[S.v];
 if(S.sheet&&S.sheet.kind!=='menu'){var f=document.getElementById(S.sheet.focus||'f-name');if(f){f.focus()}}}
function readDraft(){var n=document.getElementById('f-name');if(!n)return null;var cur=S.sheet.draft||{};return {name:n.value,amount:document.getElementById('f-amount').value,day:document.getElementById('f-day').value,cat:cur.cat||(S.sheet.kind==='edit'?find(S.sheet.id).cat:'Contas')}}
function validate(d){var e={},name=d.name.trim(),amt=parseFloat(String(d.amount).replace(/\./g,'').replace(',','.')),day=parseInt(d.day,10);
