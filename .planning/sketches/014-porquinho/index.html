<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link id="theme" rel="stylesheet" href="../themes/moeda.css"><link rel="stylesheet" href="../themes/base.css"><link rel="stylesheet" href="../themes/v31.css"><link rel="stylesheet" href="../themes/dock.css">
<title>014 Porquinho</title>
<style>
/* Piso S8: tokens Moeda, texto só em 12/16/28/56 com pesos 400/700, alvos de 44px, cartões raio 22 sem borda e sem sombra, ícones Lucide inline (sem rede). */
:root{--ok-ink:#166534;--danger-ink:#b91c1c;--pig-bg:#fce7f3;--pig-ink:#be185d}
body{font-family:var(--font-sans)}
.phone{height:800px;font:400 16px/1.5 var(--font-sans);color:var(--color-text)}
.phone button,.phone input{font:inherit;color:inherit}
.phone :focus-visible{outline:2px solid var(--color-action);outline-offset:2px}
.page{height:100%;overflow-y:auto;padding:16px 16px 120px;scrollbar-width:none;position:relative}.page::-webkit-scrollbar{display:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.phone .top h1{font:700 28px/1.2 var(--font-num);letter-spacing:0;margin:0}
.eyebrow{font:700 12px/1.5 var(--font-sans);color:var(--color-text-muted);margin:0}
.cap{font:400 12px/1.5 var(--font-sans);color:var(--color-text-muted);margin:0}
.hero{text-align:center;margin-top:20px}
.disp{font:700 56px/1.1 var(--font-num);letter-spacing:-.03em;white-space:nowrap;margin:4px 0}
.disp.sm{font-size:28px;line-height:1.2}.disp.neg{color:var(--danger-ink)}
.cd{background:var(--color-surface);border-radius:22px;padding:16px;border:0;box-shadow:none}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.cd .lb{display:flex;align-items:center;gap:6px;font:700 12px/1.5 var(--font-sans);color:var(--color-text-muted)}
.cd .val{font:700 28px/1.2 var(--font-num);margin-top:4px;white-space:nowrap}.cd .val.sm{font-size:16px;line-height:1.5}
.gh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:20px 2px 8px;font:700 12px/1.5 var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--color-text-muted)}
.gh h2{font:inherit;margin:0;letter-spacing:inherit}.gh span{text-transform:none;letter-spacing:0}
.lst{list-style:none;padding:0;margin:0}.lst>li+li{margin-top:8px}
.rw{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:8px 12px;border:0;border-radius:16px;background:var(--color-surface);text-align:left;cursor:pointer}
.rw .ic{width:44px;height:44px;border-radius:50%;background:var(--color-surface-2);display:grid;place-items:center;flex:none;position:relative;z-index:1}
.rw .ic.in{color:var(--ok-ink)}.rw .ic.out{color:var(--danger-ink)}
.rw .mid{flex:1;min-width:0;display:block}
.rw .t{display:block;font:700 16px/1.5 var(--font-sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .s{display:block;font:400 12px/1.5 var(--font-sans);color:var(--color-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .v{font:700 16px/1.5 var(--font-num);white-space:nowrap}.rw .v.in{color:var(--ok-ink)}
.grp{background:var(--color-surface);border-radius:22px;padding:4px 12px;border:0}
.grp .lst>li+li{margin-top:0;border-top:1px solid var(--color-track)}
.grp .rw{background:none;border-radius:0;padding:8px 0}
.rowc{display:flex;align-items:center;gap:12px}
.pig{width:48px;height:48px;border-radius:50%;background:var(--pig-bg);color:var(--pig-ink);display:grid;place-items:center;flex:none}.pig svg{width:24px;height:24px}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--color-track);margin-top:12px}
.split i{display:block;height:100%}.kept{background:var(--color-primary)}.gone{background:var(--color-warn)}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.leg .lb .dot{margin:0}.leg b{display:block;font:700 16px/1.5 var(--font-num);white-space:nowrap}
.chips2{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.chips2 button{height:44px;padding:0 12px;border-radius:999px;border:0;background:var(--color-surface);font:700 16px/1.5 var(--font-sans);cursor:pointer}
.chips2 button[aria-pressed="true"]{background:var(--color-action);color:var(--color-action-text)}
.compact{display:flex;align-items:center;gap:12px;margin-top:16px}.compact .grow{flex:1;min-width:0}.compact .disp{margin:0}
.tlist{position:relative}.tlist::before{content:'';position:absolute;left:21px;top:22px;bottom:22px;width:2px;background:var(--color-track)}
.tlist .rw{background:none;border-radius:0;padding:8px 0}
.state{text-align:center;padding:40px 8px}.state svg{width:28px;height:28px;color:var(--color-text-muted)}
.state .t{font:700 16px/1.5 var(--font-sans);margin:8px 0 0}.state .s{font:400 12px/1.5 var(--font-sans);color:var(--color-text-muted);margin:0}
.cta{margin-top:16px;min-height:48px;padding:0 20px;border-radius:999px;border:0;background:var(--color-action);color:var(--color-action-text);font:700 16px/1.5 var(--font-sans);cursor:pointer}
.sk{height:56px;border-radius:16px;background:var(--color-surface);margin-top:8px}.sk.h{height:120px;border-radius:22px;margin-top:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;font:400 12px/1.5 var(--font-sans)}
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end}
.sheetin{width:100%;background:var(--color-bg);border-radius:28px 28px 0 0;padding:10px 16px 22px;max-height:92%;overflow:auto}
.grab{width:40px;height:4px;border-radius:9px;background:var(--color-track);margin:0 auto 12px}
.sh-hd{display:flex;align-items:center;gap:12px}.sh-hd .ti{flex:1;min-width:0}
.sh-hd h2{font:700 16px/1.5 var(--font-sans);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sh-hd p{font:400 12px/1.5 var(--font-sans);color:var(--color-text-muted);margin:0}
.sh-hd .v{font:700 16px/1.5 var(--font-num);white-space:nowrap}
.sheetin .act-row{display:flex;align-items:center;gap:12px;width:100%;height:56px;border:0;border-radius:16px;padding:0 12px;margin-top:8px;background:var(--color-surface);font:700 16px/1.5 var(--font-sans);text-align:left;cursor:pointer}
.sheetin .act-row.dg{color:var(--danger-ink)}
.q{font:700 16px/1.5 var(--font-sans);margin:0}.q+p{font:400 16px/1.5 var(--font-sans);margin:4px 0 0;color:var(--color-text-muted)}
.row2{display:flex;gap:8px;margin-top:16px}.row2 button{flex:1;height:56px;border-radius:16px;border:0;font:700 16px/1.5 var(--font-sans);cursor:pointer}
.btn-p{background:var(--color-action);color:var(--color-action-text)}.btn-s{background:var(--color-surface);color:var(--color-text)}.btn-d{background:var(--danger-ink);color:#fff}
.seg2{display:flex;background:var(--color-surface);border-radius:999px;padding:4px;gap:2px;margin-top:12px}
.seg2 button{flex:1;height:44px;border:0;background:none;border-radius:999px;font:700 16px/1.5 var(--font-sans);color:var(--color-text-muted);cursor:pointer}
.seg2 button[aria-selected="true"]{background:var(--color-surface-2);color:var(--color-text)}
.fld{margin-top:12px}.fld label{display:block;font:700 12px/1.5 var(--font-sans);color:var(--color-text-muted);margin-bottom:4px}
.fld input{width:100%;height:52px;border-radius:16px;border:1px solid var(--color-border);background:var(--color-surface-2);padding:0 16px;font:400 16px/1.5 var(--font-sans);color:var(--color-text)}
.fld input[aria-invalid="true"]{border-color:var(--danger-ink)}
.err{font:400 12px/1.5 var(--font-sans);color:var(--danger-ink);margin-top:4px}
.toast{position:absolute;left:16px;right:16px;top:12px;min-height:48px;background:var(--color-action);color:var(--color-action-text);border-radius:16px;padding:10px 16px;font:700 16px/1.5 var(--font-sans);z-index:60}
#variant-nav label{font:12px system-ui;margin-left:auto;display:flex;align-items:center;gap:6px}#estsel{font:12px system-ui;height:32px}
#selftest{white-space:pre-wrap;font:12px monospace;max-width:420px;margin:8px auto;color:#333}
</style></head><body>
<div id="variant-nav">
<button class="variant-tab" data-v="a">A: Saldo em destaque</button>
<button class="variant-tab" data-v="b">B: Cofre com barra</button>
<button class="variant-tab" data-v="c">C: Linha do tempo</button>
<label>Estado <select id="estsel"><option value="ok">Com dados</option><option value="vazio">Vazio</option><option value="carregando">Carregando</option><option value="erro">Erro</option></select></label></div>
<div class="phone"><div id="app" style="height:100%"></div><div id="dockhost"></div></div>
<div class="note" id="vnote"></div><div id="selftest"></div>
<script>
(function(){
'use strict';
var errors=[];window.addEventListener('error',function(e){errors.push(String(e.message))});
var MONTHS=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var TODAY='2026-11-18';
var P={
'plus':'<path d="M5 12h14"/><path d="M12 5v14"/>','check':'<path d="M20 6 9 17l-5-5"/>',
'trash-2':'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
'arrow-down-left':'<path d="M17 7 7 17"/><path d="M17 17H7V7"/>','arrow-up-right':'<path d="M7 7h10v10"/><path d="M7 17 17 7"/>',
'piggy-bank':'<path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2V5z"/><path d="M2 9v1c0 1.1.9 2 2 2h1"/><path d="M16 11h.01"/>',
'house':'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
'receipt':'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',
'calendar':'<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
'repeat':'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
'flag':'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/>',
'pie-chart':'<path d="M21 12c.552 0 1.005-.449.95-.998a10 10 0 0 0-8.953-8.951c-.55-.055-.998.398-.998.95v8a1 1 0 0 0 1 1z"/><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/>',
'users':'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
'circle-alert':'<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>'};
function ic(n){return '<svg class="lucide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'+P[n]+'</svg>'}
var DOCK=[['house','Início'],['receipt','Transações'],['calendar','Calendário'],['repeat','Contas fixas'],['flag','Metas'],['pie-chart','Relatórios'],['users','Casal'],['piggy-bank','Porquinho']];
var NOTES={a:'Saldo em destaque (56px; cai para 28px com 12 ou mais caracteres) e dois números lado a lado. O histórico é agrupado por dia, com o total do dia à direita. Boa para quem abre o Porquinho só para ver "quanto temos".',
b:'Cartão de cofre: o saldo e uma barra que divide o total guardado entre "No cofre" e "Retirado". Filtros Tudo, Guardados e Retirados e histórico agrupado por mês. Boa para ver o quanto do guardado já foi usado.',
c:'Linha do tempo enxuta: saldo compacto no topo (sempre 28px) e uma lista contínua com trilho, sem grupos. Boa para ler o Porquinho como uma sequência de acontecimentos.'};
var DEFAULT=[
{id:'m1',type:'deposito',desc:'Freela do mês',amount:450,date:'2026-11-18',who:'Ela'},
{id:'m2',type:'saque',desc:'Conserto da geladeira',amount:280,date:'2026-11-16',who:'Ele'},
{id:'m3',type:'deposito',desc:'Troco do mercado',amount:35.5,date:'2026-11-14',who:'Ela'},
{id:'m4',type:'deposito',desc:'Parte do 13º',amount:600,date:'2026-11-12',who:'Ele'},
{id:'m5',type:'saque',desc:'Presente da sobrinha',amount:120,date:'2026-11-09',who:'Ela'},
{id:'m6',type:'deposito',desc:'Sobra da semana',amount:150,date:'2026-11-07',who:'Ele'},
{id:'m7',type:'saque',desc:'Farmácia',amount:64.9,date:'2026-11-07',who:'Ela'},
{id:'m8',type:'deposito',desc:'Venda da bicicleta',amount:380,date:'2026-11-05',who:'Ela'},
{id:'m9',type:'saque',desc:'Passeio de domingo',amount:95,date:'2026-11-02',who:'Ele'},
{id:'m10',type:'deposito',desc:'Reembolso do plano',amount:220,date:'2026-10-31',who:'Ela'},
{id:'m11',type:'saque',desc:'Material do curso',amount:210,date:'2026-10-29',who:'Ela'},
{id:'m12',type:'deposito',desc:'Sobra do mês',amount:1200,date:'2026-10-28',who:'Ele'}];
function clone(o){return JSON.parse(JSON.stringify(o))}
var S={v:'a',estado:'ok',items:clone(DEFAULT),seq:100,sheet:null,filter:'all',toast:null,err:{},opener:null};
function brl(v){return 'R$ '+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function sbrl(v){return (v<0?'−':'')+brl(v)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function dm(iso){return iso.slice(8,10)+'/'+iso.slice(5,7)}
function longDay(iso){return (iso===TODAY?'Hoje · ':'')+parseInt(iso.slice(8,10),10)+' de '+MONTHS[parseInt(iso.slice(5,7),10)-1]}
function monthLabel(iso){var m=MONTHS[parseInt(iso.slice(5,7),10)-1];return m.charAt(0).toUpperCase()+m.slice(1)+' de '+iso.slice(0,4)}
function totals(){var d=0,s=0;S.items.forEach(function(m){var c=Math.round(m.amount*100);if(m.type==='deposito')d+=c;else s+=c});return {dep:d/100,saq:s/100,bal:(d-s)/100}}
function fitDisp(str){return str.replace(/^−/,'').length<=11?'':' sm'}
function fitCard(str){return str.replace(/^−/,'').length<=8?'':' sm'}
function ordered(){return S.items.map(function(m,i){return {m:m,i:i}}).sort(function(a,b){return a.m.date<b.m.date?1:a.m.date>b.m.date?-1:a.i-b.i}).map(function(x){return x.m})}
function net(list){var c=0;list.forEach(function(m){c+=(m.type==='deposito'?1:-1)*Math.round(m.amount*100)});return c/100}
function find(id){return S.items.filter(function(m){return m.id===id})[0]}
function head(){return '<div class="top"><h1>Porquinho</h1><button class="round act" data-act="new" aria-label="Nova movimentação" title="Nova movimentação">'+ic('plus')+'</button></div>'}
function rowHTML(m){var dep=m.type==='deposito',k=dep?'Depósito':'Saque';
 return '<li><button class="rw" data-act="open" data-id="'+m.id+'" aria-label="'+k+' de '+brl(m.amount)+', '+esc(m.desc)+', '+dm(m.date)+'. Abrir opções"><span class="ic '+(dep?'in':'out')+'">'+ic(dep?'arrow-down-left':'arrow-up-right')+'</span><span class="mid"><b class="t">'+esc(m.desc)+'</b><span class="s">'+k+' · '+m.who+' · '+dm(m.date)+'</span></span><b class="v'+(dep?' in':'')+'">'+(dep?'+':'−')+brl(m.amount)+'</b></button></li>'}
function groupBy(list,keyFn){var o=[],idx={};list.forEach(function(m){var k=keyFn(m);if(!(k in idx)){idx[k]=o.length;o.push({k:k,items:[]})}o[idx[k]].items.push(m)});return o}
function bodyA(){var t=totals(),bs=sbrl(t.bal);
 var h='<section class="hero" aria-labelledby="hl"><h2 class="eyebrow" id="hl">Saldo do Porquinho</h2><div class="disp'+fitDisp(bs)+(t.bal<0?' neg':'')+'" id="bal">'+bs+'</div><p class="cap">guardado menos retirado</p></section>'+
 '<div class="duo"><div class="cd"><div class="lb">'+ic('arrow-down-left')+'Guardado</div><div class="val'+fitCard(brl(t.dep))+'" id="k-dep">'+brl(t.dep)+'</div></div><div class="cd"><div class="lb">'+ic('arrow-up-right')+'Retirado</div><div class="val'+fitCard(brl(t.saq))+'" id="k-saq">'+brl(t.saq)+'</div></div></div>';
 groupBy(ordered(),function(m){return m.date}).forEach(function(g){var n=net(g.items);
  h+='<section aria-labelledby="d'+g.k+'"><div class="gh"><h2 id="d'+g.k+'">'+longDay(g.k)+'</h2><span>'+(n<0?'−':'+')+brl(n)+'</span></div><ul class="lst">'+g.items.map(rowHTML).join('')+'</ul></section>'});
 return h}
function bodyB(){var t=totals(),bs=sbrl(t.bal),f=S.filter,kept=t.dep>0?Math.max(0,Math.min(100,Math.round(t.bal/t.dep*100))):0,gone=100-kept;
 var list=ordered().filter(function(m){return f==='all'||(f==='dep'&&m.type==='deposito')||(f==='saq'&&m.type==='saque')});
 var h='<section class="cd" style="margin-top:16px" aria-labelledby="hl"><div class="rowc"><span class="pig">'+ic('piggy-bank')+'</span><h2 class="eyebrow" id="hl">Saldo do cofre</h2></div><div class="disp'+fitDisp(bs)+(t.bal<0?' neg':'')+'" id="bal">'+bs+'</div>'+
 '<p class="cap">Total guardado <span id="k-dep">'+brl(t.dep)+'</span></p>'+
 '<div class="split" role="img" aria-label="Do total guardado, '+kept+'% está no cofre e '+gone+'% foi retirado"><i class="kept" style="width:'+kept+'%"></i><i class="gone" style="width:'+gone+'%"></i></div>'+
 '<div class="leg"><div><div class="lb"><i class="dot kept"></i>No cofre · '+kept+'%</div><b>'+sbrl(t.bal)+'</b></div><div><div class="lb"><i class="dot gone"></i>Retirado · '+gone+'%</div><b id="k-saq">'+brl(t.saq)+'</b></div></div></section>'+
 '<div class="chips2" role="group" aria-label="Filtrar movimentações">'+[['all','Tudo'],['dep','Guardados'],['saq','Retirados']].map(function(x){return '<button data-act="filter" data-f="'+x[0]+'" aria-pressed="'+(f===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
 if(!list.length)return h+'<div class="state"><p class="t">Nada neste filtro.</p></div>';
 groupBy(list,function(m){return m.date.slice(0,7)}).forEach(function(g){var n=net(g.items);
  h+='<section aria-labelledby="mo'+g.k+'"><div class="gh"><h2 id="mo'+g.k+'">'+monthLabel(g.k+'-01')+'</h2><span>'+g.items.length+(g.items.length===1?' movimentação · ':' movimentações · ')+(n<0?'−':'+')+brl(n)+'</span></div><div class="grp"><ul class="lst">'+g.items.map(rowHTML).join('')+'</ul></div></section>'});
 return h}
function bodyC(){var t=totals(),bs=sbrl(t.bal);
 return '<section class="cd compact" aria-labelledby="hl"><span class="pig">'+ic('piggy-bank')+'</span><div class="grow"><h2 class="eyebrow" id="hl">Saldo do Porquinho</h2><div class="disp sm'+(t.bal<0?' neg':'')+'" id="bal">'+bs+'</div><p class="cap">Guardado <span id="k-dep">'+brl(t.dep)+'</span> · Retirado <span id="k-saq">'+brl(t.saq)+'</span></p></div></section>'+
 '<div class="gh"><h2>Movimentações</h2><span>'+S.items.length+' no total</span></div><ul class="lst tlist">'+ordered().map(rowHTML).join('')+'</ul>'}
function stateHTML(k){
 if(k==='carregando')return '<div role="status" aria-live="polite"><span class="sr">Carregando o Porquinho</span><div class="sk h"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>';
