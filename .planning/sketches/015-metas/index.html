<style>
/* Piso S8: tokens Moeda, texto só em 12/16/28/56 com pesos 400/700, alvos de 44px, cartões raio 22 sem borda e sem sombra, ícones Lucide inline (sem rede). */
:root{--ok-ink:#166534;--danger-ink:#b91c1c}
body{font-family:var(--font-sans)}
.phone{height:800px;font:400 16px/1.5 var(--font-sans);color:var(--color-text)}
:where(.phone) button,:where(.phone) input{font:inherit;color:inherit}
.phone :focus-visible{outline:2px solid var(--color-action);outline-offset:2px}
.page{height:100%;overflow-y:auto;padding:16px 16px 120px;scrollbar-width:none;position:relative}.page::-webkit-scrollbar{display:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.phone .top h1{font:700 28px/1.2 var(--font-num);letter-spacing:0;margin:0}
.eyebrow{font:700 12px/1.5 var(--font-sans);color:var(--color-text-muted);margin:0}
.cap{font:400 12px/1.5 var(--font-sans);color:var(--color-text-muted);margin:0}
.disp{font:700 56px/1.1 var(--font-num);letter-spacing:-.03em;white-space:nowrap;margin:0}
.cd{background:var(--color-surface);border-radius:22px;padding:16px;border:0;box-shadow:none}
.lst{list-style:none;padding:0;margin:0}.lst>li+li{margin-top:8px}

.gh h2{font:inherit;margin:0;letter-spacing:inherit}.gh span{text-transform:none;letter-spacing:0}
.mid{flex:1;min-width:0;display:block}
.mid .t{display:block;font:700 16px/1.5 var(--font-sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid .s{display:block;font:400 12px/1.5 var(--font-sans);color:var(--color-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc{font:700 16px/1.5 var(--font-num);white-space:nowrap}
.ic{width:44px;height:44px;border-radius:50%;background:var(--color-surface-2);display:grid;place-items:center;flex:none}
.rw{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:8px 12px;border:0;border-radius:16px;background:var(--color-surface);text-align:left;cursor:pointer}
.grp{background:var(--color-surface);border-radius:22px;padding:4px 12px;border:0;margin-top:16px}
.grp .lst>li+li{margin-top:0;border-top:1px solid var(--color-track)}
.grp .rw{background:none;border-radius:0;padding:8px 0}
.rw>svg:last-child{color:var(--color-text-muted)}
.rg{position:relative;width:48px;height:48px;flex:none;display:grid;place-items:center}
.rg svg{position:absolute;inset:0;width:48px;height:48px;transform:rotate(-90deg)}.rg b{font:700 12px/1 var(--font-num);position:relative}
.goal{margin-top:12px}
.gbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0;border:0;background:none;text-align:left;cursor:pointer;border-radius:16px}
.bar2{height:12px;border-radius:99px;background:var(--color-track);overflow:hidden;margin-top:12px}.bar2 i{display:block;height:100%;border-radius:99px;background:var(--color-primary);transition:width .4s ease-out}
.nums{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;margin-top:8px}
.nums b{font:700 16px/1.5 var(--font-num);white-space:nowrap}.nums span{font:400 12px/1.5 var(--font-sans);color:var(--color-text-muted)}.nums .fl{margin-left:auto}
.cta2{margin-top:12px;width:100%;min-height:48px;border-radius:999px;border:0;background:var(--color-action);color:var(--color-action-text);font:700 16px/1.5 var(--font-sans);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.done{display:flex;align-items:center;gap:6px;margin:12px 0 0;min-height:48px;font:700 16px/1.5 var(--font-sans);color:var(--ok-ink)}
.feat .disp{margin-top:4px}.feat .t2{font:700 16px/1.5 var(--font-sans);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{height:6px;border-radius:99px;background:var(--color-track);overflow:hidden;margin:4px 0}.mini i{display:block;height:100%;background:var(--color-primary)}
.state{text-align:center;padding:40px 8px}.state svg{width:28px;height:28px;color:var(--color-text-muted)}
.state .t{font:700 16px/1.5 var(--font-sans);margin:8px 0 0}.state .s{font:400 12px/1.5 var(--font-sans);color:var(--color-text-muted);margin:0}
.cta{margin-top:16px;min-height:48px;padding:0 20px;border-radius:999px;border:0;background:var(--color-action);color:var(--color-action-text);font:700 16px/1.5 var(--font-sans);cursor:pointer}
.sk{height:56px;border-radius:16px;background:var(--color-surface);margin-top:8px}.sk.h{height:140px;border-radius:22px;margin-top:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;font:400 12px/1.5 var(--font-sans)}
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end}
.sheetin{width:100%;background:var(--color-bg);border-radius:28px 28px 0 0;padding:10px 16px 22px;max-height:92%;overflow:auto}
.grab{width:40px;height:4px;border-radius:9px;background:var(--color-track);margin:0 auto 12px}
.sh-hd{display:flex;align-items:center;gap:12px}.sh-hd .ti{flex:1;min-width:0}
.sh-hd h2{font:700 16px/1.5 var(--font-sans);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sh-hd p{font:400 12px/1.5 var(--font-sans);color:var(--color-text-muted);margin:0}
.sh-hd .v{font:700 16px/1.5 var(--font-num);white-space:nowrap}
.sheetin .act-row{display:flex;align-items:center;gap:12px;width:100%;height:56px;border:0;border-radius:16px;padding:0 12px;margin-top:8px;background:var(--color-surface);font:700 16px/1.5 var(--font-sans);text-align:left;cursor:pointer}
.sheetin .act-row.dg{color:var(--danger-ink)}
.recent{margin-top:4px}.recent li{display:flex;justify-content:space-between;gap:8px;padding:4px 0}
.recent b{font:700 16px/1.5 var(--font-num);color:var(--ok-ink);white-space:nowrap}.recent span{font:400 12px/1.5 var(--font-sans);color:var(--color-text-muted);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q{font:700 16px/1.5 var(--font-sans);margin:0}.q+p{font:400 16px/1.5 var(--font-sans);margin:4px 0 0;color:var(--color-text-muted)}
.row2{display:flex;gap:8px;margin-top:16px}.row2 button{flex:1;height:56px;border-radius:16px;border:0;font:700 16px/1.5 var(--font-sans);cursor:pointer}
.btn-p{background:var(--color-action);color:var(--color-action-text)}.btn-s{background:var(--color-surface);color:var(--color-text)}.btn-d{background:var(--danger-ink);color:#fff}
.fld{margin-top:12px}.fld label{display:block;font:700 12px/1.5 var(--font-sans);color:var(--color-text-muted);margin-bottom:4px}
.fld input{width:100%;height:52px;border-radius:16px;border:1px solid var(--color-border);background:var(--color-surface-2);padding:0 16px;font:400 16px/1.5 var(--font-sans);color:var(--color-text)}
.fld input[aria-invalid="true"]{border-color:var(--danger-ink)}
.err{font:400 12px/1.5 var(--font-sans);color:var(--danger-ink);margin-top:4px}
.toast{position:absolute;left:16px;right:16px;top:12px;min-height:48px;background:var(--color-action);color:var(--color-action-text);border-radius:16px;padding:10px 16px;font:700 16px/1.5 var(--font-sans);z-index:60}
#variant-nav label{font:12px system-ui;margin-left:auto;display:flex;align-items:center;gap:6px}#estsel{font:12px system-ui;height:32px}
#selftest{white-space:pre-wrap;font:12px monospace;max-width:420px;margin:8px auto;color:#333}
</style></head><body>

'circle-alert':'<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>'};
function ic(n){return '<svg class="lucide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'+P[n]+'</svg>'}
var DOCK=[['house','Início'],['receipt','Transações'],['calendar','Calendário'],['repeat','Contas fixas'],['flag','Metas'],['pie-chart','Relatórios'],['users','Casal'],['piggy-bank','Porquinho']];
var NOTES={a:'Cartões empilhados: cada meta mostra barra de progresso, percentual, quanto falta e o botão Aportar no próprio cartão. Tocar no topo do cartão abre as ações (Aportar, Editar, Apagar). Boa para aportar rápido, sem abrir nada antes.',
b:'Lista compacta com anel de progresso. Tocar numa meta abre o detalhe em Sheet: barra, quanto falta, aportes recentes e as ações. Boa para ver todas as metas de uma vez sem rolar muito.',
c:'A meta mais próxima do prazo ganha destaque (percentual grande, barra e Aportar); as demais ficam numa lista simples abaixo. Boa para o casal focar no que vence primeiro.'};
var DEFAULT=[
{id:'g1',name:'Viagem de férias',target:6000,cur:3900,deadline:'2027-01-31',ap:[{id:'a1',amount:1000,desc:'Bônus do trabalho',date:'2026-11-10'},{id:'a2',amount:800,desc:'',date:'2026-10-28'},{id:'a3',amount:700,desc:'',date:'2026-10-05'},{id:'a4',amount:900,desc:'Venda de itens usados',date:'2026-09-15'},{id:'a5',amount:500,desc:'',date:'2026-09-01'}]},
{id:'g2',name:'Reserva de emergência',target:10000,cur:4200,deadline:null,ap:[{id:'a6',amount:1500,desc:'Sobra do mês',date:'2026-11-15'},{id:'a7',amount:1200,desc:'',date:'2026-10-20'},{id:'a8',amount:800,desc:'',date:'2026-09-30'},{id:'a9',amount:700,desc:'',date:'2026-09-10'}]},
{id:'g3',name:'Notebook novo',target:3500,cur:3500,deadline:'2026-12-20',ap:[{id:'a10',amount:2000,desc:'Trabalho extra',date:'2026-11-02'},{id:'a11',amount:1000,desc:'',date:'2026-10-12'},{id:'a12',amount:500,desc:'',date:'2026-09-20'}]},
{id:'g4',name:'Curso de inglês',target:1800,cur:450,deadline:'2026-12-15',ap:[{id:'a13',amount:250,desc:'',date:'2026-11-12'},{id:'a14',amount:200,desc:'Primeiro aporte',date:'2026-10-25'}]}];
function clone(o){return JSON.parse(JSON.stringify(o))}
var S={v:'a',estado:'ok',goals:clone(DEFAULT),seq:100,sheet:null,toast:null,err:{},opener:null};
function brl(v){return 'R$ '+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function dm(iso){return iso.slice(8,10)+'/'+iso.slice(5,7)}
function dmy(iso){return iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4)}
function toFmt(v){return v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function pct(g){return g.target>0?Math.min(100,Math.round(g.cur/g.target*100)):0}
function done(g){return g.cur>=g.target}
function left(g){return Math.max(0,Math.round((g.target-g.cur)*100)/100)}
function days(iso){var a=iso.split('-'),b=TODAY.split('-');return Math.round((Date.UTC(+a[0],+a[1]-1,+a[2])-Date.UTC(+b[0],+b[1]-1,+b[2]))/864e5)}
function prazo(g){if(!g.deadline)return 'Sem prazo';var d=days(g.deadline);return 'Prazo '+dmy(g.deadline)+(d>1?' · em '+d+' dias':d===1?' · amanhã':d===0?' · hoje':' · venceu')}
function find(id){return S.goals.filter(function(g){return g.id===id})[0]}
function nearest(){var inc=S.goals.filter(function(g){return !done(g)});var wd=inc.filter(function(g){return g.deadline}).sort(function(a,b){return a.deadline<b.deadline?-1:1});return wd[0]||inc[0]||null}

function bodyB(){return '<div class="grp"><ul class="lst">'+S.goals.map(function(g){return '<li data-g="'+g.id+'"><button class="rw" data-act="open" data-id="'+g.id+'" aria-label="'+openLabel(g)+'">'+ring(g)+'<span class="mid"><b class="t">'+esc(g.name)+'</b><span class="s">'+(done(g)?'Concluída · '+brl(g.target):brl(g.cur)+' de '+brl(g.target))+'</span></span>'+ic('chevron-right')+'</button></li>'}).join('')+'</ul></div>'}
function bodyC(){var f=nearest(),h='';
