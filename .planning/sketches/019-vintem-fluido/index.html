<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link id="theme" rel="stylesheet" href="../themes/moeda.css">
<title>019 Vintém fluido</title>
<style>
/* Sketch 019: autossuficiente (sem fontes, scripts nem imagens externas). Só tamanhos 12, 16, 28 e 56 e pesos 400 e 700. Desenho e animação originais: silhueta sólida + molas amortecidas em JS puro. */
*{box-sizing:border-box;margin:0}
body{background:var(--color-bg);font:400 16px/1.4 var(--font-sans);color:var(--color-text);min-height:100vh;overflow-x:hidden}
button,select,input{font:inherit;color:inherit}
#variant-nav{background:var(--color-surface-2);border-bottom:1px solid var(--color-border);padding:6px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font:400 12px var(--font-sans)}
.variant-tab{height:44px;min-width:44px;border:1px solid var(--color-border);background:var(--color-surface-2);border-radius:12px;padding:0 16px;cursor:pointer;font:400 12px var(--font-sans);color:var(--color-text)}
.variant-tab.active{background:var(--color-action);color:#fff;border-color:var(--color-action);font-weight:700}
#fps{margin-left:auto;font:400 12px var(--font-sans);color:var(--color-text-muted)}
#wrap{max-width:720px;margin:0 auto;padding:12px 16px 32px}
.note{font:400 12px/1.4 var(--font-sans);color:var(--color-text-muted);margin:4px 0 12px}
h1{font:700 28px/1.2 var(--font-sans);letter-spacing:-.02em}
h2{font:700 16px var(--font-sans);margin-bottom:8px}
.card{background:var(--color-surface);border-radius:22px;padding:16px;margin-top:12px}
.stage{display:flex;justify-content:center;align-items:center;min-height:290px;border-radius:16px;background:var(--stage);padding:56px 0 16px}
.cap{font:400 12px var(--font-sans);color:var(--color-text-muted);text-align:center;margin-top:8px}
.ctl{display:grid;gap:12px}
.ctl label{display:flex;align-items:center;gap:12px;font:400 16px var(--font-sans);min-height:44px}
.ctl select{height:44px;border:1px solid var(--color-border);border-radius:12px;background:var(--color-surface-2);padding:0 12px;flex:1;min-width:0}

.pct{font:700 16px var(--font-sans);width:56px;text-align:right}
.sw{width:56px;height:44px;border:0;background:none;padding:0;cursor:pointer;display:grid;align-items:center}
.sw i{display:block;width:52px;height:30px;border-radius:15px;background:var(--color-track);position:relative}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s}
.sw[aria-checked=true] i{background:var(--color-action)}
.sw[aria-checked=true] i:after{transform:translateX(22px)}
.sp{flex:1}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{height:44px;padding:0 16px;border-radius:16px;border:0;background:var(--color-action);color:#fff;font:700 16px var(--font-sans);cursor:pointer}
.btn.alt{background:var(--color-surface-2);color:var(--color-text);border:1px solid var(--color-border);font-weight:400}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--color-action);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cell{width:100px;min-height:44px;border:0;background:var(--stage);padding:8px 0;cursor:pointer;border-radius:16px;display:grid;justify-items:center;gap:4px}
.cell.on{outline:2px solid var(--color-action)}
.cell span{font:400 12px var(--font-sans);color:var(--color-text)}.cell.on span{font-weight:700}
.sm{width:84px;height:69px;display:block}
.big{width:240px;height:196px;display:block}
.gaugebox{position:relative;width:240px;height:150px;margin:0 auto}

.gaugebox .gv{position:absolute;left:78px;top:60px}
.glabel{text-align:center;font:700 16px var(--font-sans);margin-top:4px}
.gwrap{background:var(--stage);border-radius:16px;padding:16px 0}
.talk{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bubble{background:#111;color:#fff;border-radius:18px;padding:12px 16px;font:400 16px/1.4 var(--font-sans);max-width:260px;position:relative;transform-origin:0 70%}

.icons{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.icon{border-radius:22%;display:grid;place-items:center;background:var(--tile)}
.icon.i96{width:96px;height:96px}.icon.i96 .vt{width:76px;height:62px}
.icon.i48{width:48px;height:48px}.icon.i48 .vt{width:38px;height:31px}
.vt svg{width:100%;height:100%;display:block;overflow:visible}
.vt.sm,.vt.big{overflow:visible}
.vt .body{fill:var(--body)}.vt .snout{fill:var(--snout)}.vt .nos{fill:var(--nos)}
.vt .scl{fill:var(--eye)}.vt .pup{fill:var(--pupil)}.vt .gl{fill:var(--glint)}.vt .lid{fill:var(--body)}.vt .ring{fill:none;stroke:var(--body);stroke-width:1.3}
.vt .coin{fill:var(--coin)}.vt .coinring{fill:none;stroke:var(--coinline);stroke-width:2.4}.vt .coinmark{fill:var(--coinline)}

.vt .tail{fill:none;stroke:var(--body);stroke-width:7;stroke-linecap:round}
.vt .a-sweat{fill:#60a5fa}.vt .a-anger{fill:none;stroke:#dc2626;stroke-width:4;stroke-linecap:round}
.vt .a-spark{fill:#f59e0b}.vt .a-heart{fill:#e11d48}.vt .a-excl{fill:#d97706}.vt .a-z{fill:none;stroke:var(--zcol);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.v-a{--body:#111;--snout:#262626;--nos:#050505;--eye:#fff;--pupil:#111;--glint:#fff;--coin:#22c55e;--coinline:#0b3d1c;--slot:#22c55e;--mouthfill:#050505;--zcol:#77746a}
.v-b{--body:#14532d;--snout:#1d6b3d;--nos:#0a2f19;--eye:#fff;--pupil:#0a2f19;--glint:#fff;--coin:#f7f1cf;--coinline:#14532d;--slot:#0a2f19;--mouthfill:#0a2f19;--zcol:#77746a}
.v-c{--body:#fff4d6;--snout:#f1dfb2;--nos:#7a6a3e;--eye:#111;--pupil:#111;--glint:#fff;--coin:#15803d;--coinline:#dcfce7;--slot:#14532d;--mouthfill:#7a6a3e;--zcol:#d1fae5}
#app.va{--stage:#f1ede3;--tile:#f4b400}#app.vb{--stage:#f1ede3;--tile:#fde68a}#app.vc{--stage:#14532d;--tile:#16a34a}
#app.vc .glabel,#app.vc .cell span{color:#fff}#app.vc .stage .cap{color:#fff}
#selftest{white-space:pre-wrap;font:400 12px monospace;margin-top:12px;color:var(--color-text-muted)}
@media (prefers-reduced-motion:reduce){.sw i:after{transition:none}}
</style></head><body>

<script>
'use strict';
/* ================= solver de mola amortecida ================= */
var clamp=function(v,a,b){return Math.min(b,Math.max(a,v))};
function Spring(v,k,c,m){this.x=v;this.v=0;this.t=v;this.k=k;this.c=c;this.m=m||1}
Spring.prototype.snap=function(v){this.x=this.t=v;this.v=0};
Spring.prototype.step=function(dt,crit){
  var k=this.k,c=this.c;if(crit){k=Math.max(k,420);c=2*Math.sqrt(k*this.m)}
  var n=Math.max(1,Math.ceil(dt*240)),h=dt/n;
  for(var i=0;i<n;i++){var a=((this.t-this.x)*k-this.v*c)/this.m;this.v+=a*h;this.x+=this.v*h}
};
/* parametros padrao (rigidez k, amortecimento c, massa 1). zeta = c/(2*sqrt(k)) */
var P={body:[200,11],pos:[160,15],rot:[140,12],look:[110,16],eye:[260,22],blinkClose:[1500,78],blinkOpen:[260,26],
  mouth:[240,20],popIn:[360,17],popOut:[200,29],ear:[170,8],tail:[90,4.5],turn:[70,12],coin:[140,10],wake:[200,18],gauge:[60,11]};
function mk(v,p){return new Spring(v,p[0],p[1],1)}

/* ================= estados ================= */
function E(w,h,cv,tl,cu){return{w:w,h:h,cv:cv,tl:tl,cu:cu}}
var STATES=['neutro','feliz','triste','bravo','sonolento','surpreso'];
var ALL=STATES.concat(['atento']);
var ST={
 neutro:{L:E(36,44,.1,-4,0),R:E(36,44,.46,10,0),pr:.58,sm:.45,op:0,sk:.9,sy:1,rot:0,ly:0,acc:{}},
 feliz:{L:E(38,38,0,0,.95),R:E(38,38,0,0,.95),pr:.6,sm:1,op:.55,sk:0,sy:1.02,rot:0,ly:0,acc:{spark:1}},
 triste:{L:E(33,42,.32,-22,0),R:E(33,42,.32,-22,0),pr:.66,sm:-.9,op:0,sk:0,sy:.97,rot:0,ly:.5,acc:{sweat:1}},
 bravo:{L:E(35,34,.4,24,0),R:E(35,34,.4,24,0),pr:.46,sm:-.5,op:0,sk:0,sy:.97,rot:0,ly:0,acc:{anger:1}},
 sonolento:{L:E(37,34,.8,0,0),R:E(37,34,.8,0,0),pr:.6,sm:.05,op:.25,sk:0,sy:.97,rot:0,ly:.2,acc:{zzz:1}},
 surpreso:{L:E(41,54,0,0,0),R:E(41,54,0,0,0),pr:.34,sm:0,op:1,sk:0,sy:1.05,rot:0,ly:0,acc:{excl:1}},
 atento:{L:E(36,45,.08,-10,0),R:E(36,45,.08,-10,0),pr:.55,sm:-.25,op:0,sk:-.4,sy:1,rot:0,ly:0,acc:{sweat:1}}
};
var ACCS=['sweat','anger','spark','heart','zzz','excl'];
var LABEL={neutro:'Neutro',feliz:'Feliz',triste:'Triste',bravo:'Bravo',sonolento:'Sonolento',surpreso:'Surpreso',atento:'Atento'};
function stateFromPct(p){return p<40?'feliz':p<75?'neutro':p<=100?'atento':p<=130?'bravo':'triste'}

/* ================= mundo (relogio simulado) ================= */
var W={t:0,reduced:false,rmUser:false,follow:true,flip:false,pointer:{x:0,y:0,has:false},inst:[],q:[],paused:false,
  later:function(ms,fn){W.q.push({at:W.t+ms/1000,fn:fn})},
  step:function(dt){
    dt=clamp(dt,0,1/30);W.t+=dt;
    for(var i=0;i<W.q.length;){if(W.q[i].at<=W.t){var f=W.q.splice(i,1)[0];f.fn()}else i++}
    for(var j=0;j<W.inst.length;j++)W.inst[j].update(dt);
    for(var s=0;s<W.ext.length;s++)W.ext[s](dt);
  },
  render:function(){for(var j=0;j<W.inst.length;j++)W.inst[j].draw()},ext:[]
};
function reducedNow(){return W.reduced||W.rmUser}
var mq=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)');
W.rmUser=!!(mq&&mq.matches);
if(mq&&mq.addEventListener)mq.addEventListener('change',function(e){W.rmUser=e.matches});

/* ================= desenho ================= */
var UID=0;
var BODY='M28,120C28,72 68,46 120,46C172,46 212,72 212,120C212,158 176,174 120,174C64,174 28,158 28,120Z';
function svgMarkup(id){
 var feet='';for(var i=0;i<4;i++)feet+='<rect class="body foot" x="-13" y="-6" width="26" height="16" rx="8"/>';
 return '<svg viewBox="8 14 224 180" role="img" aria-label="Vintém, o porquinho-cofre">'+
 '<defs><clipPath id="'+id+'c"><rect x="-300" y="-400" width="900" height="454"/></clipPath>'+
 '<clipPath id="'+id+'l"><ellipse class="cl" rx="18" ry="22"/></clipPath><clipPath id="'+id+'r"><ellipse class="cl" rx="18" ry="22"/></clipPath></defs>'+
 '<g class="root">'+
 '<g class="tailG"><path class="tail" d="M0,0C10,-3 16,-12 12,-20C8,-27 -3,-24 0,-16"/></g>'+
 '<g class="feet">'+feet+'</g>'+
 '<g class="earL"><path class="body" d="M-28,46C-36,14 -26,-18 -6,-22C14,-24 28,2 36,46Z"/></g>'+
 '<g class="earR"><path class="body" d="M-28,46C-36,14 -26,-18 -6,-22C14,-24 28,2 36,46Z"/></g>'+
 '<g class="bodyG"><path class="body" d="'+BODY+'"/></g>'+
 '<ellipse class="slot" cx="120" cy="54" rx="22" ry="4.4"/>'+
 '<g clip-path="url(#'+id+'c)"><g class="coinR"><g class="coinS"><circle class="coin" r="20"/><circle class="coinring" r="13.5"/><rect class="coinmark" x="-2.2" y="-7" width="4.4" height="14" rx="2.2"/></g></g>'+
 '<g class="coinF"><g class="coinFS"><circle class="coin" r="20"/><circle class="coinring" r="13.5"/><rect class="coinmark" x="-2.2" y="-7" width="4.4" height="14" rx="2.2"/></g></g></g>'+
 '<path class="lip" d="M98,54Q120,60 142,54"/>'+
 '<g class="snoutG"><ellipse class="snout" rx="26" ry="17"/><ellipse class="nos n0" cx="-9" cy="0" rx="3.2" ry="4.6"/><ellipse class="nos n1" cx="9" cy="0" rx="3.2" ry="4.6"/></g>'+
 '<path class="mouth"/>'+
 eyeMarkup(id+'l','eL')+eyeMarkup(id+'r','eR')+
 '</g>'+
 '<g class="accG">'+
 '<g class="acc sweat"><path class="a-sweat" d="M0,-13C4,-6 8,-2 8,3A8,8 0 0 1 -8,3C-8,-2 -4,-6 0,-13Z"/></g>'+
 '<g class="acc anger"><path class="a-anger" d="M-9,-4Q-4,-4 -4,-9M4,-9Q4,-4 9,-4M9,4Q4,4 4,9M-4,9Q-4,4 -9,4"/></g>'+
 '<g class="acc spark"><path class="a-spark" d="M0,-13Q1.5,-1.5 13,0Q1.5,1.5 0,13Q-1.5,1.5 -13,0Q-1.5,-1.5 0,-13Z"/></g>'+
 '<g class="acc spark2"><path class="a-spark" d="M0,-13Q1.5,-1.5 13,0Q1.5,1.5 0,13Q-1.5,1.5 -13,0Q-1.5,-1.5 0,-13Z"/></g>'+
 '<g class="acc heart"><path class="a-heart" d="M0,9C-14,-1 -10,-12 -4,-12C-1,-12 0,-9 0,-8C0,-9 1,-12 4,-12C10,-12 14,-1 0,9Z"/></g>'+
 '<g class="acc excl"><rect class="a-excl" x="-3.6" y="-14" width="7.2" height="18" rx="3.6"/><circle class="a-excl" cx="0" cy="11" r="4"/></g>'+
 '<g class="zs"><g class="z z0"><path class="a-z" d="M-6,-6H6L-6,6H6"/></g><g class="z z1"><path class="a-z" d="M-6,-6H6L-6,6H6"/></g><g class="z z2"><path class="a-z" d="M-6,-6H6L-6,6H6"/></g></g>'+
 '</g></svg>';
}
function eyeMarkup(cid,cls){
 return '<g class="'+cls+'"><g clip-path="url(#'+cid+')"><ellipse class="scl" rx="18" ry="22"/><circle class="pup" r="9"/><circle class="gl" r="3.2"/>'+
 '<rect class="lid up" x="-60" y="-80" width="120" height="80"/><ellipse class="lid lo" rx="24" ry="34"/></g><ellipse class="ring" rx="18" ry="22"/></g>';
}
/* projecao em perfil: x = 120 + R sin(beta), beta = asin(u/R) - theta; escala = cos(beta)/cos(beta0) */
function proj(u,R,th){var b0=Math.asin(clamp(u/R,-1,1)),b=b0-th;return{x:120+R*Math.sin(b),s:Math.max(0,Math.cos(b)/Math.cos(b0))}}
function f2(n){return (Math.round(n*100)/100)}

function Vintem(host,variant,o){
 o=o||{};var V=this,id='vt'+(++UID);V.id=id;V.host=host;V.variant=variant;V.state=o.state||'neutro';V.follow=o.follow!==false;
 V.flash=null;V.flashUntil=0;V.ov={};V.react=0;V.ph=Math.random()*6.28;V.bT=1.5+Math.random()*2;V.bS=0;V.blinks=0;V.dT=0;V.dx=0;V.dy=0;
 V.sleepT=0;V.earT=3;V.lastBreath=0;V.lastLook=[0,0];
 host.classList.add('vt','v-'+variant);host.innerHTML=svgMarkup(id);
 var q=function(c){return host.querySelector('.'+c)};V.q=q;
 V.el={root:q('root'),tailG:q('tailG'),earL:q('earL'),earR:q('earR'),bodyG:q('bodyG'),slot:q('slot'),coinR:q('coinR'),coinS:q('coinS'),coinF:q('coinF'),coinFS:q('coinFS'),
  snoutG:q('snoutG'),mouth:q('mouth'),accG:q('accG'),feet:host.querySelectorAll('.foot'),lip:q('lip'),n0:q('n0'),n1:q('n1'),
  eyes:[eyeRefs(q('eL'),host.querySelector('clipPath[id="'+id+'l"] ellipse')),eyeRefs(q('eR'),host.querySelector('clipPath[id="'+id+'r"] ellipse'))],acc:{},zs:[q('z0'),q('z1'),q('z2')]};
 ['sweat','anger','spark','spark2','heart','excl'].forEach(function(n){V.el.acc[n]=q(n)});
 var S={};V.S=S;
 S.sx=mk(1,P.body);S.sy=mk(1,P.body);S.px=mk(0,P.pos);S.py=mk(0,P.pos);S.rot=mk(0,P.rot);S.lx=mk(0,P.look);S.ly=mk(0,P.look);S.turn=mk(0,P.turn);
 S.blink=mk(0,P.blinkOpen);S.wake=mk(0,P.wake);S.pr=mk(.58,P.eye);S.sm=mk(.4,P.mouth);S.op=mk(0,P.mouth);S.sk=mk(0,P.mouth);
 S.earL=mk(0,P.ear);S.earR=mk(0,P.ear);S.tail=mk(0,P.tail);S.coinY=mk(0,P.coin);S.coinFY=mk(-300,P.coin);S.coinFv=mk(0,P.popOut);S.coinFs=mk(0,[20,6]);S.coinBump=mk(0,[300,14]);
 S.L={};S.R={};var n0=ST[V.state];
 ['w','h','cv','tl','cu'].forEach(function(k){S.L[k]=mk(n0.L[k],P.eye);S.R[k]=mk(n0.R[k],P.eye)});
 S.acc={};ACCS.forEach(function(a){S.acc[a]=mk(n0.acc[a]?1:0,P.popOut)});S.spark2=mk(0,P.popOut);
 V.snap();
}
function eyeRefs(g,cl){return{g:g,cl:cl,scl:g.querySelector('.scl'),pup:g.querySelector('.pup'),gl:g.querySelector('.gl'),ring:g.querySelector('.ring'),up:g.querySelector('.up'),lo:g.querySelector('.lo')}}
Vintem.prototype.snap=function(){
 var V=this,S=V.S,p=ST[V.state];
 V.targets(0,true);
 (function all(o){for(var k in o){if(o[k] instanceof Spring)o[k].snap(o[k].t);else if(o[k]&&typeof o[k]==='object')all(o[k])}})(S);
 V.draw();
};
Vintem.prototype.effState=function(){return W.t<this.flashUntil?this.flash:this.state};
Vintem.prototype.setState=function(s){this.state=s};
Vintem.prototype.flashState=function(s,ms){this.flash=s;this.flashUntil=W.t+ms/1000};
/* calcula alvos de todas as molas */
Vintem.prototype.targets=function(dt,isSnap){
 var V=this,S=V.S,ov=V.ov,rm=reducedNow(),eff=V.effState(),Pz=ST[eff];
 /* respiracao: volume preservado, sx = 1/sy */
 var T=eff==='sonolento'?5.6:3.6,amp=eff==='sonolento'?.028:eff==='surpreso'?.012:.02;
 var b=rm?0:Math.sin(W.t*6.2832/T+V.ph);V.lastBreath=b;
 var sy=Pz.sy*(1+amp*b);
 /* sonolento: cabeca cai aos poucos e volta */
 var droop=0;
 if(eff==='sonolento'&&!rm){V.sleepT+=dt;droop=clamp(V.sleepT/4,0,1);droop=droop*droop*(3-2*droop);
   if(V.sleepT>4.6){V.sleepT=0;S.wake.t=1;S.wake.k=P.wake[0];W.later(380,function(){S.wake.t=0});V.ov.nod=1;W.later(260,function(){V.ov.nod=0})}}
 else if(eff!=='sonolento')V.sleepT=0;
 if(ov.sy!=null)sy=ov.sy;
 if(eff==='sonolento'&&!rm)sy-=droop*.035;
 S.sy.t=sy;S.sx.t=1/sy;
 /* olhar */
 var lx=0,ly=0;
 if(!rm){
  var pt=W.pointer;
  if(V.follow&&W.follow&&pt.has){var r=V.host.getBoundingClientRect();var cx=r.left+r.width/2,cy=r.top+r.height/2;
    var rw=Math.max(r.width,90);lx=Math.tanh((pt.x-cx)/(rw*1.1));ly=Math.tanh((pt.y-cy)/(rw*1.1))}
  else{V.dT-=dt;if(V.dT<=0){V.dT=1+Math.random()*2.4;V.dx=(Math.random()*2-1)*.8;V.dy=(Math.random()*2-1)*.5}lx=V.dx;ly=V.dy*.7}
 }
 ly=clamp(ly+Pz.ly*(rm?1:1),-1,1);
 if(ov.lx!=null)lx=ov.lx;if(ov.ly!=null)ly=ov.ly;
 if(eff==='sonolento'&&!rm){lx*=.4;ly=.3+droop*.3}
 S.lx.t=lx;S.ly.t=ly;
 /* cabeca/corpo inclina para o olhar */
 S.rot.t=(rm?0:lx*3)+(Pz.rot||0)+(ov.rot||0)+(eff==='sonolento'&&!rm?droop*9-(V.ov.nod?5:0):0);
 S.px.t=(rm?0:lx*3.5)+(ov.px||0);
 S.py.t=(ov.py||0)+(eff==='sonolento'&&!rm?droop*5:0);
