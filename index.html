<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#f5ecdb" />
    <script>
      /* Tema antes do primeiro desenho (D-09). Mesma chave e mesmas cores de shared/core/theme.js,
         comparadas por teste (test/static/phase5-theme.test.js). Sincrono, JS antigo, sem dependencia. */
      (function () {
        var pref = 'auto'
        try {
          var stored = localStorage.getItem('coinc:tema:v1')
          if (stored === 'claro' || stored === 'escuro') pref = stored
        } catch (e) {}
        var dark = pref === 'escuro'
        if (pref === 'auto') {
          try {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches === true
          } catch (e) {}
        }
        var root = document.documentElement
        if (dark) root.classList.add('dark')
        else root.classList.remove('dark')
        root.style.colorScheme = dark ? 'dark' : 'light'
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', dark ? '#0a1510' : '#f5ecdb')
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Coinc" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Coinc</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Falha de abertura sem bundle (D-14): se #root seguir vazio por 8 s, mostra uma tela estatica de
         falha com saida. Por DOM (createElement e textContent), so cores de sistema para acompanhar o tema
         ja aplicado. Se o React montar depois, o bloco some sozinho. */
      (function () {
        var root = document.getElementById('root')
        if (!root) return
        var BLOCK_ID = 'coinc-boot-error'
        function drop() {
          var el = document.getElementById(BLOCK_ID)
          if (el && el.parentNode) el.parentNode.removeChild(el)
        }
        setTimeout(function () {
          if (root.firstChild) return
          var wrap = document.createElement('div')
          wrap.id = BLOCK_ID
          wrap.setAttribute('role', 'alert')
          wrap.style.cssText =
            'box-sizing:border-box;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;text-align:center;font-family:system-ui,sans-serif;background:Canvas;color:CanvasText'
          var title = document.createElement('h1')
          title.textContent = 'Não foi possível abrir o Coinc'
          title.style.cssText = 'margin:0;font-size:28px;line-height:1.2;font-weight:700'
          var text = document.createElement('p')
          text.textContent = 'Pode ser a conexão ou uma atualização em andamento. Tente de novo.'
          text.style.cssText = 'margin:0;font-size:16px;max-width:28rem'
          var button = document.createElement('button')
          button.type = 'button'
          button.textContent = 'Tentar de novo'
          button.style.cssText =
            'height:56px;width:100%;max-width:28rem;border:2px solid CanvasText;border-radius:16px;background:Canvas;color:CanvasText;font-size:16px;font-weight:700;cursor:pointer'
          button.addEventListener('click', function () {
            location.reload()
          })
          wrap.appendChild(title)
          wrap.appendChild(text)
          wrap.appendChild(button)
          root.appendChild(wrap)
          // O React pode montar depois deste bloco: assim que entrar outro filho, o bloco sai.
          if (typeof MutationObserver === 'function') {
            var observer = new MutationObserver(function () {
              if (root.childNodes.length > 1 || (root.firstChild && root.firstChild.id !== BLOCK_ID)) {
                drop()
                observer.disconnect()
              }
            })
            observer.observe(root, { childList: true })
          }
        }, 8000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
